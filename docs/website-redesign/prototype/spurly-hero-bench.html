<title>Spurly Hero Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380..600;1,9..144,380..500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: a comparison bench. Toolbar on top, then one or two live hero variants side by side, each a self-contained container-query layout. Single warm look for the bench; variant D is a deliberate dark foil. */
:root{
  --bench:#e9e1d3;
  --bench-ink:#1e1a16;
  --bench-2:#5a5148;
  --bench-card:#fffdf8;
  --bench-line:rgba(30,26,22,.16);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bench);color:var(--bench-ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #0d9bb5;outline-offset:3px;border-radius:8px}

/* ---------- bench toolbar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
  padding:12px max(16px,3vw);background:rgba(233,225,211,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bench-line)}
.bar h2{margin:0;font:500 18px var(--display);letter-spacing:-.01em;margin-right:auto}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--bench-card);border:1px solid var(--bench-line);border-radius:999px}
.seg button,.tog{font:500 13px/1 var(--body);color:var(--bench-2);background:transparent;border:0;border-radius:999px;padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bench-ink);color:#fbf7ef}
.tog{background:var(--bench-card);border:1px solid var(--bench-line);color:var(--bench-ink)}
.tog[aria-pressed="true"]{background:#0a6f82;color:#fff;border-color:#0a6f82}
.panes{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;padding:18px max(16px,2vw) 40px}
.panes.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.panes.two{grid-template-columns:minmax(0,1fr)}}
.pane-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font:12.5px var(--mono);color:var(--bench-2)}
.pane-head select{font:500 13px var(--body);padding:8px 12px;border-radius:10px;border:1px solid var(--bench-line);background:var(--bench-card);color:var(--bench-ink)}
.pane-head b{color:var(--bench-ink);font-weight:500}
.host{border-radius:26px;overflow:hidden;border:1px solid var(--bench-line);box-shadow:0 24px 60px -30px rgba(60,40,20,.35)}

/* ---------- hero (themed via vars on .hero) ---------- */
.hero{--paper:#f3ede3;--ink:#1e1a16;--ink-2:#5a5148;--teal:#0a6f82;--teal-bright:#0d9bb5;--card:#fffdf8;--line:rgba(30,26,22,.12);
  --glass:rgba(255,253,248,.62);--glass-edge:rgba(255,255,255,.7);--btn-ink-bg:#1e1a16;--btn-ink-fg:#fbf7ef;--cta:#0a6f82;--grain-blend:multiply;--grain-op:.5;
  position:relative;isolation:isolate;container:hero/inline-size;background:var(--paper);color:var(--ink);padding:104px clamp(16px,4cqw,40px) 56px;min-height:640px}
.hero.v-dark{--paper:#0b0d12;--ink:#f3ede3;--ink-2:#a8a499;--teal:#52cde0;--card:#151922;--line:rgba(255,255,255,.14);
  --glass:rgba(21,25,34,.55);--glass-edge:rgba(255,255,255,.14);--btn-ink-bg:#f3ede3;--btn-ink-fg:#0b0d12;--grain-blend:soft-light;--grain-op:.35}
.bgfx{position:absolute;inset:0;width:100%;height:100%;z-index:-3;display:block}
.bgsoft{position:absolute;inset:0;z-index:-4;background:radial-gradient(60% 70% at 78% 30%,#f6cfae 0%,transparent 70%),radial-gradient(50% 60% at 95% 85%,#a9dbe3 0%,transparent 70%),var(--paper)}
.v-dark .bgsoft{background:radial-gradient(60% 70% at 80% 30%,#0f3c48 0%,transparent 70%),var(--paper)}
.grain{position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:var(--grain-op);mix-blend-mode:var(--grain-blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.nav{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:1080px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px 9px 16px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-edge);border-radius:999px}
.brand{display:flex;align-items:center;gap:9px;font:500 19px var(--display);letter-spacing:-.01em}
.links{display:flex;gap:22px;font-size:14px;color:var(--ink-2)}
.nav-right{display:flex;align-items:center;gap:8px}
.signin{font-size:14px;color:var(--ink-2);padding:8px 10px}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 15px/1 var(--body);padding:13px 20px;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:transform .25s cubic-bezier(.16,1,.3,1)}
.btn:hover{transform:translateY(-2px)}
.btn-ink{background:var(--btn-ink-bg);color:var(--btn-ink-fg)}
.btn-teal{background:var(--cta);color:#fff;box-shadow:0 10px 28px rgba(10,111,130,.32)}
.btn-ghost{background:var(--glass);border-color:var(--line);color:var(--ink)}
.btn-sm{padding:10px 15px;font-size:14px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:32px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--mono);letter-spacing:.04em;color:var(--teal);background:var(--glass);border:1px solid var(--line);padding:9px 13px;border-radius:999px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--teal-bright);box-shadow:0 0 0 4px rgba(13,155,181,.22)}
h1{font-family:var(--display);font-weight:420;font-size:clamp(40px,7.2cqw,90px);line-height:.98;letter-spacing:-.035em;margin:20px 0;text-wrap:balance;font-variation-settings:"opsz" 144,"SOFT" 50}
h1 em{font-style:italic;font-weight:380;color:var(--teal)}
h1 .ln{display:block}
.lead{max-width:50ch;font-size:clamp(15px,1.6cqw,18px);color:var(--ink-2);margin:0 0 26px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.stats{display:flex;flex-wrap:wrap;gap:12px 30px;font:12px var(--mono);color:var(--ink-2);padding-top:20px;border-top:1px solid var(--line);max-width:520px}
.stats b{display:block;font:420 24px/1.1 var(--display);color:var(--ink);letter-spacing:-.02em;margin-bottom:2px}

.stage{position:relative;height:520px;perspective:1300px;--rx:0deg;--ry:0deg;min-width:0}
.stage canvas.sc{position:absolute;inset:0;width:100%;height:100%;display:block}
.rig{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));pointer-events:none}
.card{position:absolute;background:var(--card);border:1px solid var(--glass-edge);border-radius:20px;padding:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 30px 60px -22px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.08)}
.v-dark .card{background:linear-gradient(160deg,rgba(32,38,52,.92),rgba(18,22,30,.92));backdrop-filter:blur(10px)}
.c-profile{width:min(310px,78%);left:0;top:16px;transform:translateZ(20px) rotate(-3deg)}
.c-msg{width:min(330px,84%);right:0;top:150px;transform:translateZ(110px) rotate(1.5deg)}
.c-status{width:min(260px,66%);left:8%;bottom:10px;transform:translateZ(60px) rotate(-1deg)}
.c-msg-s{width:min(280px,64%);right:0;bottom:14px;transform:translateZ(90px) rotate(1.5deg)}
.c-chip{width:auto;left:2%;top:18px;padding:12px 16px;transform:translateZ(70px) rotate(-2deg)}
.c-city{width:min(250px,60%);left:0;bottom:16px;transform:translateZ(80px) rotate(-1.5deg)}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pill{font:500 10.5px/1 var(--mono);padding:6px 9px;border-radius:999px;background:rgba(13,155,181,.14);color:var(--teal);white-space:nowrap}
.pill.warm{background:rgba(242,185,143,.35);color:#8a4a1d}
.v-dark .pill.warm{background:rgba(242,185,143,.18);color:#f2b98f}
.who{display:flex;gap:11px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 15px var(--display);color:#fff;background:linear-gradient(140deg,#0d9bb5,#0a6f82);flex:none}
.who b{display:block;font-weight:600;font-size:14.5px}
.who span{font-size:12.5px;color:var(--ink-2)}
.rows{margin-top:12px;display:grid;gap:7px;font-size:12.5px}
.rows div{display:flex;justify-content:space-between;gap:12px;padding-top:7px;border-top:1px dashed var(--line);color:var(--ink-2)}
.rows b{font-weight:500;color:var(--ink);text-align:right}
.msg{margin:0;font-size:13.5px;line-height:1.55}
.msg em{font-family:var(--display);font-style:italic;color:var(--teal)}
.msg-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font:11.5px var(--mono);color:var(--ink-2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:50px;margin-top:10px}
.bars i{flex:1;background:linear-gradient(var(--teal-bright),#0a6f82);border-radius:4px 4px 2px 2px}
.stat-row{display:flex;justify-content:space-between;align-items:baseline}
.stat-row b{font:420 32px/1 var(--display);letter-spacing:-.03em}
.stat-row span{font:11.5px var(--mono);color:var(--ink-2)}
.note{position:absolute;right:2%;bottom:-4px;font:10.5px var(--mono);color:var(--ink-2);opacity:.8;z-index:2}
/* globe-layout: cards sit on the edges so the globe stays readable */
.stage.tall{height:600px}
.globe-layout .card{padding:13px}
.globe-layout .tag{font-size:9.5px;letter-spacing:.05em;white-space:nowrap}
.globe-layout .c-profile{width:min(256px,48%);left:0;top:0;transform:translateZ(30px) rotate(-3deg)}
.globe-layout .c-msg{width:min(246px,47%);right:0;top:auto;bottom:34px;transform:translateZ(90px) rotate(1.5deg)}
.globe-layout .c-status{width:min(206px,39%);left:0;bottom:4px;transform:translateZ(60px) rotate(-1deg)}
.globe-layout .rows{font-size:11.5px;gap:6px;margin-top:10px}
.globe-layout .rows div:nth-child(3){display:none}
.globe-layout .who b{font-size:13.5px}
.globe-layout .who span{font-size:11.5px}
.globe-layout .av{width:38px;height:38px;font-size:13px}
.globe-layout .msg{font-size:12.5px;line-height:1.5}
.globe-layout .bars{height:36px}
.globe-layout .stat-row b{font-size:28px}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--mono);color:var(--ink);background:rgba(255,253,248,.86);border:1px solid var(--line);padding:5px 8px;border-radius:999px;white-space:nowrap;will-change:transform,opacity}
.pin i{width:7px;height:7px;border-radius:50%;background:var(--teal-bright);box-shadow:0 0 0 3px rgba(13,155,181,.22);flex:none}
.pin em{font-style:normal;color:var(--ink-2)}
.pin.off{color:var(--ink-2);background:rgba(240,235,226,.82)}
.pin.off i{background:#8f9ba1;box-shadow:none}
.pin.you{background:var(--ink);color:#fbf7ef;border-color:transparent}
.pin.you i{background:#f2b98f;box-shadow:none}
.pin.you em{color:#d8d0c3}
.legend{position:absolute;top:0;right:0;z-index:2;display:grid;gap:5px;justify-items:end;text-align:right;font:10.5px/1.3 var(--mono);color:var(--ink-2);max-width:60%}
.legend .hl{font:italic 400 clamp(15px,2.4cqw,20px)/1.1 var(--display);color:var(--ink);letter-spacing:-.01em;margin-bottom:3px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.legend i.on{background:var(--teal-bright);box-shadow:0 0 0 3px rgba(13,155,181,.22)}
.legend i.off{background:#8f9ba1}
.fail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:12px var(--mono);color:var(--ink-2);padding:20px}

@media (prefers-reduced-motion:no-preference){
  .ln,.lead,.actions,.stats,.chip{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
  .ln:nth-child(2){animation-delay:.08s}.ln:nth-child(3){animation-delay:.16s}
  .lead{animation-delay:.26s}.actions{animation-delay:.34s}.stats{animation-delay:.42s}
  .card{animation:float 7s ease-in-out infinite}
  .c-msg,.c-msg-s{animation-delay:-2s}.c-status,.c-city{animation-delay:-4s}
}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes float{50%{translate:0 -9px}}
@container hero (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px}
  .links,.signin{display:none}
  .stage{height:430px}
  .stage.tall{height:640px}
  .globe-layout canvas.sc{height:76%}
  .globe-layout .c-profile{display:none}
  .globe-layout .c-msg{width:min(240px,62%);bottom:22px}
  .globe-layout .c-status{width:min(190px,50%)}
  .legend{max-width:100%}
  .hero{padding-top:92px}
}
</style>

<div class="bar">
  <h2>Hero bench</h2>
  <div class="seg" id="seg" role="group" aria-label="Variant"></div>
  <button class="tog" id="cmp" type="button" aria-pressed="false">Compare side by side</button>
  <button class="tog" id="mot" type="button" aria-pressed="true">Motion on</button>
</div>
<div class="panes" id="panes"></div>

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var motion=!reduce;

  var VARIANTS={
    a:{label:'A · Paper stack',blurb:'Shader paper + tilting card stack',theme:'light',bg:'paper',stage:'cards'},
    b:{label:'B · Liquid form',blurb:'Raymarched 3D blob, drifts with the cursor',theme:'light',bg:'soft',stage:'blob'},
    c:{label:'C · Orbit globe',blurb:'three.js dotted globe, live outreach arcs',theme:'light',bg:'soft',stage:'globe'},
    d:{label:'D · Midnight ribbons',blurb:'Dark cinematic shader + glass cards',theme:'dark',bg:'ribbons',stage:'cards'},
    e:{label:'E · Paper ribbons + globe',blurb:'Paper theme, ribbon contours behind a live orbit globe',theme:'light',bg:'ribbonpaper',stage:'globe2'}
  };

  /* ---------- shaders ---------- */
  var NOISE='float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}'+
    'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p*=2.02;a*=.5;}return s;}';
  var HEAD='precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;';

  var PAPER_FS=HEAD+NOISE+
    'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*1.5;'+
    'float q=fbm(p+t*.04);float w=fbm(p+2.2*q+vec2(m.x*.7,m.y*.5)+t*.03);'+
    'vec3 paper=vec3(.953,.929,.890);vec3 apricot=vec3(.949,.725,.561);vec3 teal=vec3(.62,.84,.88);vec3 rose=vec3(.96,.82,.78);'+
    'vec3 c=paper;c=mix(c,apricot,smoothstep(.42,.78,w)*.55);c=mix(c,teal,smoothstep(.45,.85,q)*.5*smoothstep(.2,.9,uv.x));'+
    'c=mix(c,rose,smoothstep(.5,.9,fbm(p*1.3-t*.02))*.25);'+
    'c=mix(c,paper,smoothstep(.0,.62,1.-uv.x)*.72);gl_FragColor=vec4(c,1.);}';

  var RIBBON_FS=HEAD+NOISE+
    'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*1.3;'+
    'float q=fbm(p+t*.03);float w=fbm(p*1.4+2.*q+m*.5-t*.02);'+
    'float s=sin(w*24.+t*.3);float line=clamp(.02/(abs(s)+.025),0.,1.5);'+
    'vec3 g=mix(vec3(.05,.68,.84),vec3(.98,.62,.4),smoothstep(.15,.95,uv.x*.7+w*.7));'+
    'vec3 c=vec3(.04,.045,.065)+g*line*.5+g*smoothstep(.45,.8,w)*.16;'+
    'c*=mix(.3,1.,smoothstep(.05,.75,uv.x+.08));c*=1.-.35*length(uv-.5);gl_FragColor=vec4(c,1.);}';

  var RIBBON_PAPER_FS=HEAD+NOISE+
    'void main(){vec2 uv=gl_FragCoord.xy/r;vec2 p=uv*vec2(r.x/r.y,1.)*1.3;'+
    'float q=fbm(p+t*.03);float w=fbm(p*1.4+2.*q+m*.5-t*.02);'+
    'vec3 paper=vec3(.953,.929,.890);vec3 apricot=vec3(.949,.725,.561);vec3 tealw=vec3(.62,.84,.88);'+
    'vec3 c=paper;c=mix(c,apricot,smoothstep(.42,.78,w)*.4);c=mix(c,tealw,smoothstep(.45,.85,q)*.4*smoothstep(.2,.9,uv.x));'+
    'float s=sin(w*24.+t*.3);float line=clamp(.02/(abs(s)+.025),0.,1.);'+
    'vec3 lc=mix(vec3(.04,.42,.5),vec3(.82,.42,.2),smoothstep(.15,.95,uv.x*.7+w*.7));'+
    'c=mix(c,lc,line*.4*smoothstep(.05,.7,uv.x+.05));'+
    'c=mix(c,paper,smoothstep(.0,.6,1.-uv.x)*.7);gl_FragColor=vec4(c,1.);}';

  var BLOB_FS=HEAD+
    'float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}'+
    'mat2 R(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}'+
    'float map(vec3 p){float d=length(p)-1.05;d+=.16*sin(2.6*p.x+t*.9)*sin(2.8*p.y+t*1.1)*sin(2.4*p.z+t*.7);'+
    'vec3 q=p-vec3(1.55*cos(t*.55),.7*sin(t*.8),1.0*sin(t*.55));d=smin(d,length(q)-.38,.55);'+
    'vec3 u=p-vec3(-1.4*cos(t*.4+1.),-.8*sin(t*.6),.8*cos(t*.5));d=smin(d,length(u)-.28,.5);return d;}'+
    'vec3 nor(vec3 p){vec2 e=vec2(.003,0.);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}'+
    'void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;'+
    'vec3 ro=vec3(0.,0.,4.8);vec3 rd=normalize(vec3(uv,-1.5));'+
    'float ay=(m.x-.5)*1.6+t*.12,ax=(.5-m.y)*.7;'+
    'ro.yz*=R(ax);rd.yz*=R(ax);ro.xz*=R(ay);rd.xz*=R(ay);'+
    'float dist=0.;bool hit=false;vec3 p;'+
    'for(int i=0;i<60;i++){p=ro+rd*dist;float d=map(p);if(d<.002){hit=true;break;}dist+=d;if(dist>9.)break;}'+
    'if(!hit){gl_FragColor=vec4(0.);return;}'+
    'vec3 nn=nor(p);vec3 v=-rd;float fr=pow(1.-max(dot(nn,v),0.),2.5);vec3 l=normalize(vec3(.6,.8,.5));float df=max(dot(nn,l),0.);'+
    'vec3 irid=.5+.5*cos(6.2831*(vec3(0.,.33,.67)+dot(nn,vec3(.2,.5,.3))*.9+fr*.4+t*.04));'+
    'vec3 teal=vec3(.05,.55,.65);vec3 apr=vec3(.97,.72,.52);vec3 base=mix(teal,apr,smoothstep(-.6,.8,nn.y*.8+nn.x*.5));'+
    'vec3 col=mix(base,irid,.35)*(.45+.65*df);col+=pow(max(dot(reflect(-l,nn),v),0.),48.)*.9;col=mix(col,vec3(1.,.98,.94),fr*.55);'+
    'gl_FragColor=vec4(col,1.);}';

  function glFx(canvas,fs,opts,scale){
    var gl=null;

      resize:function(){W=canvas.clientWidth;H=canvas.clientHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.position.z=Math.max(8.6,4.5/(2*Math.tan(16*Math.PI/180)*cam.aspect));cam.updateProjectionMatrix();dotU.scale.value=H*renderer.getPixelRatio()/2},
      render:function(time,mx,my){
        refresh();
        g.rotation.y=-2.35+time*.03+(mx-.5)*.7;g.rotation.x=.32+(.5-my)*.3;
        g.updateMatrixWorld(true);
        leads.forEach(function(x){
          var u=(time*.2+x.off)%1.6,pr=Math.min(1,u);
          x.dot.visible=x.awake&&u<1.05;x.dot.position.copy(x.curve.getPoint(pr));
          x.mk.scale.setScalar(x.awake?1+.3*Math.sin(time*2.4+x.off*5):.8);
          placeLabel(x.el,x.p);
        });
        placeLabel(originEl,originPos);
        renderer.render(scene,cam)},
      destroy:function(){renderer.dispose();var e=renderer.getContext().getExtension('WEBGL_lose_context');if(e)e.loseContext()}
    };
  }

  /* ---------- markup ---------- */
  var LOGO='<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#0a6f82"/><path d="M9 21c2-7 6-10 14-11-1 8-4 12-11 13z" fill="#fff"/><circle cx="12" cy="20" r="2.2" fill="#f2b98f"/></svg>';
  var C_PROFILE='<article class="card c-profile"><div class="tag"><span>Captured from LinkedIn</span><span class="pill">1st degree</span></div><div class="who"><div class="av">MO</div><div><b>Maya Okafor</b><span>Head of Talent, Northwind Labs</span></div></div><div class="rows"><div>Location<b>Lagos, Nigeria · UTC+1</b></div><div>Company<b>Northwind Labs</b></div><div>Enriched<b>Email · Phone · Site</b></div></div></article>';
  var C_MSG='<article class="card c-msg"><div class="tag"><span>Outreach draft</span><span class="pill warm">Q4 Talent</span></div><p class="msg">Hi Maya, I read your post on hiring across time zones. We help small teams reach candidates <em>while it is still morning for them</em>. Worth a quick look?</p><div class="msg-foot"><span>Sends 9:05 her time</span><span class="pill">Ready</span></div></article>';
  var C_STATUS='<article class="card c-status"><div class="tag"><span>This week</span><span class="pill">Live</span></div><div class="stat-row"><b>38%</b><span>invites accepted</span></div><div class="bars" aria-hidden="true"><i style="height:35%"></i><i style="height:52%"></i><i style="height:44%"></i><i style="height:68%"></i><i style="height:60%"></i><i style="height:86%"></i><i style="height:100%"></i></div></article>';
  var C_MSG_S='<article class="card c-msg-s"><div class="tag"><span>Outreach draft</span><span class="pill">Ready</span></div><p class="msg">Hi Maya, we help small teams reach candidates <em>while it is still morning for them</em>.</p></article>';
  var C_CHIP='<article class="card c-chip"><div class="stat-row"><b>38%</b><span style="margin-left:10px">invites accepted</span></div></article>';
  var C_CITY='<article class="card c-city"><div class="tag"><span>Next send</span><span class="pill">Lagos</span></div><div class="who"><div class="av">MO</div><div><b>Maya Okafor</b><span>Sends 9:05 her time · UTC+1</span></div></div></article>';

  function template(cfg){
    var stage='';
    if(cfg.stage==='cards')stage='<div class="rig">'+C_PROFILE+C_MSG+C_STATUS+'</div>';
    if(cfg.stage==='blob')stage='<canvas class="sc"></canvas><div class="rig">'+C_CHIP+C_MSG_S+'</div>';
    if(cfg.stage==='globe')stage='<canvas class="sc"></canvas><div class="rig">'+C_CITY+'</div>';
    if(cfg.stage==='globe2')stage='<canvas class="sc"></canvas><div class="labels"></div>'+
      '<div class="legend"><div class="hl">Their morning, not yours.</div><span><i class="on"></i>Awake · sends now</span><span><i class="off"></i>Asleep · queued for 9:00</span><span class="utc">UTC --:--</span></div>'+
      '<div class="rig">'+C_PROFILE+C_MSG+C_STATUS+'</div>';
    return '<section class="hero v-'+cfg.theme+'">'+
      (cfg.bg==='soft'?'<div class="bgsoft"></div>':'<canvas class="bgfx" aria-hidden="true"></canvas>')+
      '<div class="grain"></div>'+
      '<header class="nav"><a class="brand" href="#">'+LOGO+'Spurly</a><nav class="links" aria-label="Primary"><a href="#">Product</a><a href="#">How it works</a><a href="#">Who it\'s for</a><a href="#">Pricing</a></nav><div class="nav-right"><a class="signin" href="#">Sign in</a><a class="btn btn-ink btn-sm" href="#">Start free</a></div></header>'+
      '<div class="wrap"><div><span class="chip"><i></i>Now live on the Chrome Web Store</span>'+
      '<h1><span class="ln">Reach anyone.</span><span class="ln"><em>Anywhere</em> they</span><span class="ln">work.</span></h1>'+
      '<p class="lead">Spurly turns LinkedIn and Sales Navigator into your pipeline. Capture leads, enrich every profile, and send outreach that sounds like you, to the right people in any timezone.</p>'+
      '<div class="actions"><a class="btn btn-teal" href="#">Add to Chrome — Start free</a><a class="btn btn-ghost" href="#">See it in action</a></div>'+
      '<div class="stats"><div><b>190+</b>countries reachable</div><div><b>1-click</b>capture, anywhere</div><div><b>100%</b>local-only &amp; private</div></div></div>'+
      '<div class="stage'+(cfg.stage==='globe2'?' tall globe-layout':'')+'">'+stage+'<span class="note">Sample data</span></div></div></section>';
  }

  /* ---------- hero instance ---------- */
  var active=[];
  function mountHero(host,key){
    var cfg=VARIANTS[key];host.innerHTML=template(cfg);
    var hero=host.firstElementChild,stage=hero.querySelector('.stage');
    var fx=[],visible=true,raf=0,dead=false,mouse={x:.5,y:.5,sx:.5,sy:.5},t0=performance.now();

    function attach(canvas,eff){if(!eff){if(canvas&&canvas.parentNode&&canvas.classList.contains('sc'))stage.insertAdjacentHTML('beforeend','<div class="fail">3D is not available in this browser. A static poster would show here.</div>');return}fx.push(eff)}
    if(cfg.bg!=='soft'){var bg=hero.querySelector('.bgfx');var fsMap={paper:PAPER_FS,ribbons:RIBBON_FS,ribbonpaper:RIBBON_PAPER_FS};attach(bg,glFx(bg,fsMap[cfg.bg],{alpha:false},.5))}
    if(cfg.stage==='blob'){var cb=stage.querySelector('canvas.sc');attach(cb,glFx(cb,BLOB_FS,{alpha:true},.6))}
    if(cfg.stage==='globe'){var cg=stage.querySelector('canvas.sc');attach(cg,globeFx(cg))}
    if(cfg.stage==='globe2'){var cr=stage.querySelector('canvas.sc');attach(cr,globeRich(cr,stage.querySelector('.labels'),stage.querySelector('.utc')))}

    function sizeAll(){fx.forEach(function(e){e.resize()})}
    function drawAll(){var tm=(performance.now()-t0)/1000;fx.forEach(function(e){e.render(tm,mouse.sx,mouse.sy)})}
    sizeAll();drawAll();

    function onMove(ev){
      var r=hero.getBoundingClientRect();
      mouse.x=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));mouse.y=Math.min(1,Math.max(0,1-(ev.clientY-r.top)/r.height));
    }
    window.addEventListener('pointermove',onMove,{passive:true});
    var ro=new ResizeObserver(function(){sizeAll();drawAll()});ro.observe(hero);
    var io=new IntersectionObserver(function(e){visible=e[0].isIntersecting});io.observe(hero);
    function loop(){
      if(dead)return;
      if(motion&&visible){
        mouse.sx+=(mouse.x-mouse.sx)*.05;mouse.sy+=(mouse.y-mouse.sy)*.05;
        stage.style.setProperty('--ry',((mouse.sx-.5)*18).toFixed(2)+'deg');
        stage.style.setProperty('--rx',((mouse.sy-.5)*14).toFixed(2)+'deg');
        drawAll();
      }
      raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
    var inst={destroy:function(){dead=true;cancelAnimationFrame(raf);window.removeEventListener('pointermove',onMove);ro.disconnect();io.disconnect();fx.forEach(function(e){e.destroy()});host.innerHTML=''}};
    active.push(inst);return inst;
  }

  /* ---------- bench ---------- */
  var panesEl=document.getElementById('panes'),seg=document.getElementById('seg'),cmp=document.getElementById('cmp'),mot=document.getElementById('mot');
  var state={compare:false,a:'e',b:'a'},panes=[];
  var keys=Object.keys(VARIANTS);

  function optionList(sel){return keys.map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+VARIANTS[k].label+'</option>'}).join('')}

  function render(){
    panes.forEach(function(p){if(p.inst)p.inst.destroy()});panes=[];panesEl.innerHTML='';
    panesEl.className='panes'+(state.compare?' two':'');
    var n=state.compare?2:1;
    for(var i=0;i<n;i++){
      (function(slot){
        var wrap=document.createElement('div');
        var head=document.createElement('div');head.className='pane-head';
        var key=state[slot];
        head.innerHTML='<span><b>'+VARIANTS[key].label+'</b> · '+VARIANTS[key].blurb+'</span>'+(state.compare?'<select aria-label="Variant for this pane">'+optionList(key)+'</select>':'');
        var host=document.createElement('div');host.className='host';
        wrap.appendChild(head);wrap.appendChild(host);panesEl.appendChild(wrap);
        var p={inst:null};panes.push(p);
        var sel=head.querySelector('select');
        if(sel)sel.addEventListener('change',function(){state[slot]=sel.value;render()});
        p.inst=mountHero(host,key);
      })(i===0?'a':'b');
    }
    Array.prototype.forEach.call(seg.children,function(btn){btn.setAttribute('aria-pressed',String(!state.compare&&btn.dataset.k===state.a))});
    seg.style.opacity=state.compare?.45:1;
  }
  keys.forEach(function(k){
    var b=document.createElement('button');b.type='button';b.textContent=VARIANTS[k].label;b.dataset.k=k;
    b.addEventListener('click',function(){state.compare=false;cmp.setAttribute('aria-pressed','false');state.a=k;render()});
    seg.appendChild(b);
  });
  cmp.addEventListener('click',function(){
    state.compare=!state.compare;cmp.setAttribute('aria-pressed',String(state.compare));
    if(state.compare&&state.a===state.b)state.b=keys[(keys.indexOf(state.a)+1)%keys.length];
    render();
  });
  function setMotion(on){motion=on;mot.textContent='Motion '+(on?'on':'off');mot.setAttribute('aria-pressed',String(on))}
  mot.addEventListener('click',function(){setMotion(!motion)});
  setMotion(motion);
  render();
})();
</script>
